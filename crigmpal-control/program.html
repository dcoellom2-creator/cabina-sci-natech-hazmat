function initRemoteBoard(){let c=$('remoteBoard');boardCtx=c.getContext('2d');resizeRemoteBoard();window.addEventListener('resize',resizeRemoteBoard)}
function resizeRemoteBoard(){if(!boardCtx)return;let c=$('remoteBoard'),r=c.getBoundingClientRect(),w=r.width||Math.max(640,window.innerWidth*.58),h=r.height||Math.max(360,window.innerHeight*.58);c.width=Math.max(1,Math.round(w*devicePixelRatio));c.height=Math.max(1,Math.round(h*devicePixelRatio));boardCtx=c.getContext('2d');boardCtx.fillStyle='#fff';boardCtx.fillRect(0,0,c.width,c.height);let copy=boardEvents.slice();boardDrawing=false;copy.forEach(m=>applyBoard(m,false))}
function applyBoard(msg,record=true){if(!boardCtx)return;if(record){if(msg.a==='clear')boardEvents=[];else{boardEvents.push(msg);if(boardEvents.length>12000)boardEvents=boardEvents.slice(-10000)}}let c=$('remoteBoard'),x=(msg.x||0)*c.width,y=(msg.y||0)*c.height;if(msg.a==='clear'){boardCtx.fillStyle='#fff';boardCtx.fillRect(0,0,c.width,c.height);boardDrawing=false;return}if(msg.a==='start'){boardTool=msg.tool||'pen';boardDrawing=true;boardCtx.beginPath();boardCtx.moveTo(x,y);return}if(msg.a==='move'&&boardDrawing){boardTool=msg.tool||boardTool;boardCtx.lineCap='round';boardCtx.lineJoin='round';boardCtx.lineWidth=boardTool==='eraser'?28:4;boardCtx.strokeStyle=boardTool==='eraser'?'#fff':'#102133';boardCtx.lineTo(x,y);boardCtx.stroke();return}if(msg.a==='end'){boardDrawing=false}}
function handleLiveMessage(m){if(!m||!data)return;if(m.type==='PR_REMOTE_BOARD_IMAGE')receiveBoard({speakerId:m.speakerId,data:m.data});if(m.type==='PR_PROGRAM_STATE'&&!previewMode)receivePublic(m.state)}
if(liveChannel)liveChannel.onmessage=e=>{if(e.data?.kind==='state'&&!previewMode)receivePublic(e.data.payload);if(e.data?.kind?.startsWith('board/'))receiveBoard(e.data.payload)};
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==window.parent)return;handleLiveMessage(e.data)});

function scenes(){return data.event.productionScenes||data.event.publicSlides||[]}
function initials(name){return name.replace(/^(PhD\.|MSc\.|Ing\.)\s*/,'').split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()}
function loadProgram(){try{const st=JSON.parse(localStorage.getItem(storeKey));if(C.validState(st,data.event)){if(C.acceptNewer(st,lastState))render(st);return}}catch(_){}if(!lastState)render(C.holdState(data.event,null,0,'waiting',0))}
function setCamera(sp){let f=$('cameraFrame'),sid=sp.cameraStreamId||'';if(!sid){f.removeAttribute('src');$('cameraStatus').textContent='Sin cámara configurada';$('stage').classList.remove('has-camera');return}if(currentCameraId!==sid){currentCameraId=sid;f.src=sp.cameraViewUrl||('https://vdo.ninja/?view='+encodeURIComponent(sid)+'&cleanoutput&noaudio&cover');$('cameraStatus').textContent='Receptor de cámara · señal por comprobar';}$('stage').classList.add('has-camera')}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function viewUrl(sp){return sp?.cameraViewUrl||('https://vdo.ninja/?view='+encodeURIComponent(sp?.cameraStreamId||'')+'&cleanoutput&noaudio&cover&autoplay')}
function activeFlow(sc,st){let flow=sc.questionFlow||[],i=Math.max(0,Math.min(flow.length-1,Number(st.questionIndex||0)));return {flow,i,q:flow[i]||{}}}
function deckSlide(sc){
  const deck=data.event.presentationDecks?.[sc.deckId||'pinas2025'];
  return deck?.slides?.find(x=>Number(x.page)===Number(sc.slideNo))||null
}
function renderPresentation(sc){
  const box=$('nativePresentation'),slide=deckSlide(sc);
  if(!slide){
    box.innerHTML='<div class="exact-slide-wrap"><div class="deck-missing"><b>Activo de presentación no configurado</b><span>'+esc(sc.title||'')+'</span></div></div>';
    return;
  }
  const imgId='persistentSlideImg',frameId='persistentSlideFrame';
  box.innerHTML='<div class="exact-slide-wrap"><img id="'+imgId+'" class="exact-slide-img" alt="Diapositiva '+Number(sc.slideNo||0)+'" src="'+esc(slide.assetUrl||sc.assetUrl||'')+'"><iframe id="'+frameId+'" class="exact-slide-frame" title="Diapositiva '+Number(sc.slideNo||0)+'"></iframe></div>';
  const img=$(imgId),frame=$(frameId);
  img.onerror=()=>{img.style.display='none';const fallback=slide.previewUrl||sc.previewUrl;if(fallback){frame.style.display='block';frame.src=fallback}else{box.innerHTML='<div class="deck-missing"><b>No se pudo cargar la lámina</b><span>Realización: utiliza el respaldo local o cambia de escena.</span></div>'}};
}
function arr(x){return Array.isArray(x)?x:[]}

let lastMultiKey='';
function renderMulti(sc,st){
  const key=JSON.stringify([sc.id,sc.layout,sc.participants,st.questionIndex,st.question]);
  if(key===lastMultiKey&&$('multiStage').children.length)return;lastMultiKey=key;
  const box=$('multiStage'), participants=sc.participants||[st.speakerId], af=activeFlow(sc,st), q=af.q||{}, target=data.event.speakers[st.targetSpeakerId||q.to];
  if(sc.layout==='trio'){
    const cards=participants.slice(0,3).map(id=>{let sp=data.event.speakers[id]||{};return '<article class="person-card '+(q.to===id?'active-target':'')+'"><iframe class="person-cam" src="'+esc(viewUrl(sp))+'" allow="autoplay;fullscreen;picture-in-picture"></iframe><div class="person-meta"><div class="person-name">'+esc(sp.name||id)+'</div><div class="person-role">'+esc(sp.role||'')+'</div></div></article>'}).join('');
    box.innerHTML='<div class="multi-top"><div><div class="multi-tag">'+esc(sc.tag||'PANEL')+'</div><div class="multi-title">'+esc(sc.title||'')+'</div></div></div><div class="trio-grid" style="grid-template-columns:repeat('+Math.max(1,Math.min(3,participants.length))+',1fr)">'+cards+'</div><div class="question-band"><div class="to">PREGUNTA PARA<br>'+esc(target?.name||'panel')+'</div><div class="q">'+esc(q.prompt||sc.question||'')+'</div></div>';
    return;
  }
  if(sc.layout==='moderator'){
    let mid=(sc.participants||[data.event.moderatorId])[0],mod=data.event.speakers[mid]||data.event.speakers[data.event.moderatorId]||{};
    box.innerHTML='<div class="multi-top"><div><div class="multi-tag">'+esc(sc.tag||'MODERACIÓN')+'</div><div class="multi-title">'+esc(sc.title||'')+'</div></div></div><div class="mod-grid"><article class="mod-card"><iframe src="'+esc(viewUrl(mod))+'" allow="autoplay;fullscreen;picture-in-picture"></iframe><div class="person-meta"><div class="person-name">'+esc(mod.name||'Moderador')+'</div><div class="person-role">'+esc(mod.role||'')+'</div></div></article><article class="mod-script"><div class="label">PREGUNTA / ENCUADRE</div><h2>'+esc(q.prompt||sc.lead||'')+'</h2><div class="target">'+(target&&q.to!==mid?'Dirigida a: '+esc(target.name):'Conducción del moderador')+'</div><div class="flow">'+esc(sc.lead||'')+'</div></article></div>';
  }
}
function render(st){
  if(!data||!st)return;
  if(!previewMode&&!C.validState(st,data.event))return;
  lastState=st;
  let stage=$('stage');stage.className='';
  if(st.paused||st.black||!(st.participants||[]).length){
    stage.className='paused';$('cameraFrame').removeAttribute('src');currentCameraId='';$('multiStage').replaceChildren();$('nativePresentation').replaceChildren();return;
  }
  const original=scenes()[Number(st.sceneIndex)]||scenes()[0]||{};
  const layout=['moderator','trio','presentation','question','tool','cards','fullspeaker','table'].includes(st.layoutOverride)?st.layoutOverride:original.layout;
  let sc={...original,layout,participants:st.participants||original.participants,title:st.sceneTitle||original.title};
  let sp=data.event.speakers[st.speakerId]||data.event.speakers[data.event.moderatorId];
  $('speakerName').textContent=sp.name||'';$('role').textContent=sp.role||'';$('axis').textContent=sp.axis||'';$('avatar').textContent=initials(sp.name||'PR');
  const boardOwner=st.boardSpeakerId||st.targetSpeakerId||st.speakerId||sc.leadSpeaker,lastForOwner=typeof st.boardImage==='string'?st.boardImage:(boardsBySpeaker[boardOwner]||'');
  if(st.surface==='board'&&data.event.speakers[boardOwner])sp=data.event.speakers[boardOwner];
  lastBoardImage=lastForOwner;if(lastBoardImage)$('remoteBoardImage').src=lastBoardImage;else $('remoteBoardImage').removeAttribute('src');
  if(sc.layout!=='trio'&&sc.layout!=='moderator')$('multiStage').replaceChildren();
  if(sc.layout!=='tool'&&sc.layout!=='presentation')$('nativePresentation').replaceChildren();
  const effectiveLayout=st.surface==='board'?'board':(sc.layout||'cards');
  stage.classList.add('layout-'+effectiveLayout);
  if(effectiveLayout==='board'&&lastBoardImage)stage.classList.add('has-board-image');
  if(effectiveLayout==='board'){
    setCamera(sp);$('axis').textContent=sp.axis||'';$('speakerName').textContent=sp.name||'';$('role').textContent=sp.role||'';$('avatar').textContent=initials(sp.name||'PR');$('tag').textContent='PIZARRA EN VIVO';$('title').textContent=sc.title||'Pizarra';$('lead').textContent='';$('cards').innerHTML='';$('tablebox').innerHTML='';$('question').textContent='';$('source').textContent='';setTimeout(resizeRemoteBoard,60)
  }else if(sc.layout==='trio'||sc.layout==='moderator'){
    renderMulti(sc,st);
  }else if(sc.layout==='tool'){
    setCamera(sp);$('speakerName').textContent=sp.name||'';$('role').textContent=sp.role||'';$('axis').textContent=sp.axis||'';
    const url=C.safeUrl(st.externalUrl),box=$('nativePresentation');
    if(url&&box.firstElementChild?.getAttribute('src')!==url){
      box.replaceChildren();const image=/\.(png|jpe?g|webp|gif|svg)$/i.test(new URL(url).pathname),node=document.createElement(image?'img':'iframe');
      node.src=url;if(image)node.alt=sc.title||'Material de apoyo';else{node.title=sc.title||'Herramienta';node.setAttribute('sandbox','allow-scripts allow-forms allow-same-origin allow-popups');node.referrerPolicy='no-referrer'}box.appendChild(node);
    }else if(!url){box.textContent='Enlace de herramienta no válido'}
  }else if(sc.layout==='presentation'){
    setCamera(sp);renderPresentation(sc);
  }else{
    setCamera(sp);
    if(lastBoardImage)stage.classList.add('has-board-image');
    $('axis').textContent=sp.axis||'';$('speakerName').textContent=sp.name||'';$('role').textContent=sp.role||'';$('avatar').textContent=initials(sp.name||'PR');
    $('tag').textContent=sc.tag||'CONTENIDO TÉCNICO';$('title').textContent=sc.title||'';$('lead').textContent=sc.lead||'';
    $('cards').innerHTML=(sc.cards||[]).map(c=>'<div class="card"><b>'+c[0]+'</b><span>'+c[1]+'</span></div>').join('');
    $('question').textContent=st.question||sc.question||'';$('source').textContent=sc.source||'';
    $('tablebox').innerHTML=sc.table?'<table class="table"><thead><tr>'+sc.table.headers.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+sc.table.rows.map(r=>'<tr>'+r.map((x,i)=>'<td>'+(i===1?'<span class="sf">'+x+'</span>':x)+'</td>').join('')+'</tr>').join('')+'</tbody></table>':'';
    if((sc.layout||'cards')==='board')setTimeout(resizeRemoteBoard,60)
  }
  if(st.alert)stage.classList.add('alert-'+st.alert)
}
document.addEventListener('DOMContentLoaded',init);
</script></body></html>
