<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Promter Risk · Cámara</title><style>
:root{--navy:#082b4b;--bg:#0d1721;--line:#263746;--green:#1fa35c;--amber:#e88927}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#eef5fa;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column}header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}header b{font-size:15px}.muted{font-size:11px;color:#9db0bf}.wrap{flex:1;display:grid;grid-template-rows:auto 1fr auto;gap:12px;padding:12px}.status{display:flex;gap:8px;align-items:center;font-size:12px}.dot{width:10px;height:10px;border-radius:50%;background:#8b98a3}.dot.ok{background:var(--green)}.cam{background:#111b26;border-radius:16px;overflow:hidden;border:1px solid var(--line);min-height:55vh}.cam iframe{width:100%;height:100%;border:0;background:#000}.actions{display:flex;gap:8px}.btn{appearance:none;border:0;border-radius:12px;padding:13px 15px;font-weight:900;cursor:pointer;background:#1d3447;color:#fff}.btn.primary{background:var(--amber)}.help{font-size:11px;color:#aebdca;line-height:1.45}</style></head><body>
<header><div><b>Promter Risk · Cámara del teléfono</b><div class="muted">v0.14.1 · solo video · audio por Zoom</div></div><div id="who"></div></header>
<div class="wrap"><div class="status"><span id="dot" class="dot"></span><span id="state">Preparando cámara…</span></div><div class="cam"><iframe id="cam" allow="camera *;microphone *;autoplay;fullscreen;picture-in-picture;screen-wake-lock"></iframe></div><div><div class="actions"><button id="start" class="btn primary">ACTIVAR CÁMARA</button><button id="reload" class="btn">REINICIAR</button></div><p class="help">Deja esta página abierta en el teléfono durante tu intervención. No abras esta misma cámara en la computadora. El audio sigue por Zoom para evitar eco.</p></div></div>
<script>
let data=null,speakerId='kervin';const $=id=>document.getElementById(id);
function load(){let sp=data.event.speakers[speakerId],url=(sp.cameraPushUrl||'')+'&label='+encodeURIComponent(sp.name);$('cam').src=url;$('state').textContent='Solicitando permiso de cámara…';$('dot').className='dot ok';setTimeout(()=>$('state').textContent='Cámara activa · mantén esta página abierta',2500)}
async function init(){data=await (await fetch('./events-v140.json?v='+Date.now(),{cache:'no-store'})).json();let q=new URLSearchParams(location.search).get('panelista');if(q&&data.event.speakers[q])speakerId=q;let sp=data.event.speakers[speakerId];$('who').textContent=sp.name;$('state').textContent='Pulsa ACTIVAR CÁMARA';$('start').onclick=load;$('reload').onclick=load}
document.addEventListener('DOMContentLoaded',init);
</script></body></html>
