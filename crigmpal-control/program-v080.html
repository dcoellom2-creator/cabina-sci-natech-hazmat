<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Promter Risk · PROGRAM v0.8.2</title><style>
:root{--navy:#082b4b;--ink:#102133;--muted:#667789;--line:#dfe6ed;--amber:#e88927;--green:#23864a;--red:#c73333}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial;color:var(--ink)}#stage{position:absolute;inset:0;background:#fff;display:grid;grid-template-columns:32% 68%;transition:.35s ease}.black{background:#000!important}.black>*{display:none!important}
.speaker{position:relative;background:linear-gradient(160deg,#0b3154,#061829 68%);color:#fff;padding:4.2vh 2.5vw;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}.speaker:after{content:'';position:absolute;width:46vh;height:46vh;border:1px solid rgba(255,255,255,.08);border-radius:50%;right:-24vh;top:-18vh}.logos{display:flex;gap:.6vw;align-items:center;position:relative;z-index:2}.logos img{width:4.2vw;max-width:66px;min-width:42px;aspect-ratio:1;object-fit:contain;background:#fff;border-radius:12px;padding:3px}.eyebrow{font-size:.8vw;min-font-size:10px;letter-spacing:.15em;font-weight:950;color:#d7e5ef}.axis{display:inline-flex;align-self:flex-start;background:rgba(255,255,255,.13);padding:.5vw .8vw;border-radius:999px;font-size:.75vw;font-weight:950;letter-spacing:.1em}.avatar{width:11vw;height:11vw;max-width:180px;max-height:180px;min-width:112px;min-height:112px;border-radius:50%;display:grid;place-items:center;background:#fff;color:var(--navy);font-size:3.3vw;font-weight:950;box-shadow:0 16px 45px rgba(0,0,0,.25);margin:2vh 0}.speaker h1{font-size:2.4vw;line-height:1.04;margin:.8vh 0}.role{font-size:1.05vw;color:#d3e1eb;line-height:1.35}.speaker-bottom{position:relative;z-index:2}.speaker-bottom small{color:#b9cfdf}.livecue{font-size:1vw;font-weight:900;margin-top:.6vh}
.content{padding:5vh 4.2vw 3.4vh;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(135deg,#fff,#f6f9fc);min-width:0}.tag{font-size:.78vw;font-weight:950;letter-spacing:.16em;color:var(--amber)}.content h2{font-size:3.15vw;line-height:1.02;letter-spacing:-.04em;color:var(--navy);margin:1.2vh 0 1.8vh}.lead{font-size:1.28vw;line-height:1.45;color:#2b4055;max-width:95%}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:1vw;margin:2.5vh 0}.card{border:1px solid var(--line);border-radius:18px;padding:1.1vw;background:#fff;min-height:15vh}.card b{display:block;color:var(--navy);font-size:1.1vw;margin-bottom:.6vh}.card span{font-size:.92vw;color:var(--muted);line-height:1.38}.question{border-left:.38vw solid var(--amber);background:#fff7eb;border-radius:0 18px 18px 0;padding:1.3vw 1.5vw;font-size:1.62vw;line-height:1.26;font-weight:900;color:var(--navy)}.source{font-size:.72vw;color:var(--muted);border-top:1px solid var(--line);padding-top:1vh}.table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:2vh 0}.table th,.table td{padding:1vh .8vw;border-bottom:1px solid var(--line);text-align:left;font-size:.92vw}.table th{font-size:.78vw;color:var(--navy);text-transform:uppercase;letter-spacing:.06em}.sf{display:inline-flex;background:#fff0f0;color:var(--red);border-radius:999px;padding:.35vw .65vw;font-weight:950}.alertframe{position:absolute;inset:0;pointer-events:none;z-index:30;border:0 solid transparent;transition:.2s}.alert-warning .alertframe{border-width:10px;border-color:var(--amber)}.alert-danger .alertframe{border-width:12px;border-color:var(--red);box-shadow:inset 0 0 0 8px rgba(199,51,51,.15)}
.layout-question{grid-template-columns:24% 76%}.layout-question .content{justify-content:center}.layout-question .cards,.layout-question .lead,.layout-question .tablewrap{display:none}.layout-question .content h2{font-size:2vw;color:var(--muted);margin-bottom:3vh}.layout-question .question{font-size:2.55vw;padding:2.2vw;border-left-width:.55vw}.layout-fullspeaker{grid-template-columns:100% 0}.layout-fullspeaker .speaker{align-items:center;text-align:center;padding:6vh}.layout-fullspeaker .logos{position:absolute;top:4vh;left:3vw}.layout-fullspeaker .avatar{width:16vw;height:16vw;max-width:240px;max-height:240px}.layout-fullspeaker .speaker h1{font-size:3.8vw}.layout-fullspeaker .role{font-size:1.4vw}.layout-fullspeaker .content{display:none}.layout-table .cards{display:none}.remote-video{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:22px;background:#0a1622;display:none;box-shadow:0 14px 38px rgba(0,0,0,.24);margin:2vh 0}.has-remote .remote-video{display:block}.has-remote .avatar{display:none}.layout-fullspeaker.has-remote .remote-video{display:block;width:48vw;max-width:880px;margin:2vh auto}.remote-board{display:none;width:100%;height:60vh;border:1px solid var(--line);border-radius:20px;background:#fff;touch-action:none}.remote-board-image{display:none;width:100%;height:60vh;object-fit:contain;border:1px solid var(--line);border-radius:20px;background:#fff}.layout-board .remote-board{display:block}.layout-board.has-board-image .remote-board{display:none}.layout-board.has-board-image .remote-board-image{display:block}.layout-board .lead,.layout-board .cards,.layout-board .tablewrap,.layout-board .question{display:none}.layout-board .content{justify-content:flex-start}.layout-board .content h2{font-size:2.3vw;margin-bottom:2vh}
@media(max-aspect-ratio:4/3){#stage{grid-template-columns:36% 64%}.content h2{font-size:3.5vw}.cards{grid-template-columns:1fr}.card{min-height:auto}.card:nth-child(n+3){display:none}}</style><script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script></head>

<script>
let data=null,previewMode=new URLSearchParams(location.search).get('preview')==='1',remoteStream=null,boardCtx=null,boardDrawing=false,boardTool='pen',boardEvents=[],lastState=null,lastBoardImage='',mqttClient=null;const $=id=>document.getElementById(id);const liveChannel='BroadcastChannel' in window?new BroadcastChannel('promter-risk-live'):null;
async function init(){initRemoteBoard();data=await (await fetch('./events-v080.json?v='+Date.now(),{cache:'no-store'})).json();if(previewMode){window.addEventListener('message',e=>{if(e.data?.type==='PR_PREVIEW')render(e.data.state)});render({sceneIndex:0,speakerId:'kervin',alert:'',black:false})}else{initMQTT();loadProgram();window.addEventListener('storage',e=>{if(e.key==='pr_program_state')loadProgram()});if(window.opener&&!window.opener.closed)window.opener.postMessage({type:'PR_PROGRAM_READY'},location.origin)}}

function initMQTT(){let base=data.realtime.topicBase,id='prprog_'+Math.random().toString(16).slice(2,10);mqttClient=mqtt.connect(data.realtime.broker,{clientId:id,clean:true,connectTimeout:5000,reconnectPeriod:1500,keepalive:20});mqttClient.on('connect',()=>mqttClient.subscribe([base+'/state',base+'/board/+']));mqttClient.on('message',(topic,payload)=>{let obj;try{obj=JSON.parse(payload.toString())}catch(e){return}if(topic===base+'/state'){render(obj);localStorage.setItem('pr_program_state',JSON.stringify(obj))}if(topic.startsWith(base+'/board/')&&obj?.data){lastBoardImage=obj.data;$('remoteBoardImage').src=obj.data;$('stage').classList.add('has-board-image');if(lastState)render(lastState)}})}
window.setRemoteStream=function(stream){remoteStream=stream;let v=$('remoteVideo');v.srcObject=stream;v.muted=true;let st=$('stage');st.classList.add('has-remote');v.play().catch(()=>{});if(lastState)render(lastState)}
function initRemoteBoard(){let c=$('remoteBoard');boardCtx=c.getContext('2d');resizeRemoteBoard();window.addEventListener('resize',resizeRemoteBoard)}
function resizeRemoteBoard(){if(!boardCtx)return;let c=$('remoteBoard'),r=c.getBoundingClientRect(),w=r.width||Math.max(640,window.innerWidth*.58),h=r.height||Math.max(360,window.innerHeight*.58);c.width=Math.max(1,Math.round(w*devicePixelRatio));c.height=Math.max(1,Math.round(h*devicePixelRatio));boardCtx=c.getContext('2d');boardCtx.fillStyle='#fff';boardCtx.fillRect(0,0,c.width,c.height);let copy=boardEvents.slice();boardDrawing=false;copy.forEach(m=>applyBoard(m,false))}
function applyBoard(msg,record=true){if(!boardCtx)return;if(record){if(msg.a==='clear')boardEvents=[];else{boardEvents.push(msg);if(boardEvents.length>12000)boardEvents=boardEvents.slice(-10000)}}let c=$('remoteBoard'),x=(msg.x||0)*c.width,y=(msg.y||0)*c.height;if(msg.a==='clear'){boardCtx.fillStyle='#fff';boardCtx.fillRect(0,0,c.width,c.height);boardDrawing=false;return}if(msg.a==='start'){boardTool=msg.tool||'pen';boardDrawing=true;boardCtx.beginPath();boardCtx.moveTo(x,y);return}if(msg.a==='move'&&boardDrawing){boardTool=msg.tool||boardTool;boardCtx.lineCap='round';boardCtx.lineJoin='round';boardCtx.lineWidth=boardTool==='eraser'?28:4;boardCtx.strokeStyle=boardTool==='eraser'?'#fff':'#102133';boardCtx.lineTo(x,y);boardCtx.stroke();return}if(msg.a==='end'){boardDrawing=false}}
function handleLiveMessage(m){if(!m)return;if(m.type==='PR_REMOTE_BOARD')applyBoard(m.payload);if(m.type==='PR_REMOTE_BOARD_IMAGE'&&m.data){lastBoardImage=m.data;$('remoteBoardImage').src=m.data;let st=$('stage');st.classList.add('has-board-image')}if(m.type==='PR_PROGRAM_STATE'&&m.state)render(m.state)}
if(liveChannel)liveChannel.onmessage=e=>handleLiveMessage(e.data);
window.addEventListener('message',e=>{if(e.origin!==location.origin&&e.origin!=='null')return;handleLiveMessage(e.data)});

function scenes(){return data.event.productionScenes||data.event.publicSlides||[]}
function initials(name){return name.replace(/^(PhD\.|MSc\.|Ing\.)\s*/,'').split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()}
function loadProgram(){let raw=localStorage.getItem('pr_program_state');if(!raw){render({sceneIndex:0,speakerId:'kervin',alert:'',black:false});return}try{render(JSON.parse(raw))}catch(e){}}
function render(st){lastState=st;let stage=$('stage');stage.className='';if(remoteStream)stage.classList.add('has-remote');if(lastBoardImage)stage.classList.add('has-board-image');if(st.black){stage.className='black';return}let sc=scenes()[Number(st.sceneIndex)]||scenes()[0]||{},sp=data.event.speakers[st.speakerId]||data.event.speakers.kervin;stage.classList.add('layout-'+(sc.layout||'cards'));if(remoteStream)stage.classList.add('has-remote');if(lastBoardImage)stage.classList.add('has-board-image');if(st.alert)stage.classList.add('alert-'+st.alert);$('axis').textContent=sp.axis||'';$('speakerName').textContent=sp.name||'';$('role').textContent=sp.role||'';$('avatar').textContent=initials(sp.name||'PR');$('tag').textContent=sc.tag||'CONTENIDO TÉCNICO';$('title').textContent=sc.title||'';$('lead').textContent=sc.lead||'';$('cards').innerHTML=(sc.cards||[]).map(c=>'<div class="card"><b>'+c[0]+'</b><span>'+c[1]+'</span></div>').join('');$('question').textContent=sc.question||'';$('source').textContent=sc.source||'';$('tablebox').innerHTML=sc.table?'<table class="table"><thead><tr>'+sc.table.headers.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+sc.table.rows.map(r=>'<tr>'+r.map((x,i)=>'<td>'+(i===1?'<span class="sf">'+x+'</span>':x)+'</td>').join('')+'</tr>').join('')+'</tbody></table>':'';if((sc.layout||'cards')==='board')setTimeout(resizeRemoteBoard,60)}
document.addEventListener('DOMContentLoaded',init);
</script></body></html>
