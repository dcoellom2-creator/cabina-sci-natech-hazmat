<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Promter Risk · Panelista v0.6</title>
<style>
:root{--navy:#082b4b;--ink:#102133;--muted:#6b7787;--line:#dce5ed;--bg:#f3f6f9;--green:#23864a;--amber:#e88927;--red:#c73333;--shadow:0 16px 42px rgba(8,43,75,.09)}
*{box-sizing:border-box}html,body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial;background:var(--bg);color:var(--ink)}button,select,textarea{font:inherit}button{border:0;border-radius:12px;padding:11px 14px;font-weight:850;cursor:pointer}.primary{background:var(--navy);color:#fff}.secondary{background:#edf2f6;color:var(--navy)}.danger{background:#ffe8e8;color:#a71f1f}.muted{color:var(--muted)}.eyebrow{font-size:10px;font-weight:950;letter-spacing:.15em;color:#607488}
header{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:20}.brand{display:flex;gap:10px;align-items:center}.mark{width:42px;height:42px;border-radius:13px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:950}.status{display:flex;gap:7px;align-items:center;font-size:12px;font-weight:850}.dot{width:9px;height:9px;border-radius:50%;background:#9aa8b5}.dot.ok{background:var(--green)}
main{max-width:1400px;margin:auto;padding:18px}.notice{background:#eaf6ee;border-left:5px solid var(--green);padding:12px 14px;border-radius:0 14px 14px 0;color:#4e6658;margin-bottom:14px}.notice b{color:#176d33}.top{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.top h1{margin:7px 0;color:var(--navy)}select{padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}.workspace{background:#fff;border:4px solid transparent;border-radius:23px;padding:18px;box-shadow:var(--shadow)}.workspace.warning{border-color:#f0bf68}.workspace.dangerState{border-color:#ed9696}.workspace.onair{border-color:#6fa2d5;box-shadow:0 0 0 8px rgba(37,99,235,.08)}
.livegrid{display:grid;grid-template-columns:1.35fr .65fr;gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}.prompt{border-left:5px solid var(--navy);background:#f7fafc;border-radius:0 14px 14px 0;padding:17px;font-size:23px;font-weight:850;line-height:1.35;color:var(--navy)}.ideas{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.idea{border:1px solid var(--line);border-radius:13px;padding:12px;background:#fbfcfe}.idea b{display:block;color:var(--navy);margin-bottom:5px}.idea span{font-size:12px;color:var(--muted);line-height:1.35}.producer{margin-top:12px;background:#fff8ea;border-left:5px solid var(--amber);padding:12px;border-radius:0 12px 12px 0}.timer{text-align:center;display:flex;flex-direction:column;justify-content:center}.big{font-size:64px;font-weight:950;letter-spacing:-.06em;color:var(--navy)}.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:16px 0}.tab{background:transparent;color:#667789;border-bottom:3px solid transparent;border-radius:8px 8px 0 0}.tab.active{color:var(--navy);border-bottom-color:var(--navy)}.tabPanel{display:none}.tabPanel.active{display:block}.boardgrid{display:grid;grid-template-columns:1.6fr .65fr;gap:14px}.canvasbox{height:520px;border:1px solid var(--line);border-radius:15px;background:#fff;overflow:hidden}.canvasbox canvas{width:100%;height:100%;display:block;touch-action:none}.actions{display:flex;gap:8px;flex-wrap:wrap}.notes{width:100%;min-height:360px;border:1px solid var(--line);border-radius:13px;padding:13px;font-size:17px;line-height:1.5}
@media(max-width:900px){.livegrid,.boardgrid{grid-template-columns:1fr}.ideas{grid-template-columns:1fr}.top{flex-direction:column}.big{font-size:50px}.canvasbox{height:420px}}
</style><script type="module" src="./pr-firebase-v060.js"></script></head>
<body><header><div class="brand"><div class="mark">PR</div><div><b>Promter Risk · Panelista</b><div class="muted" style="font-size:11px">Firebase Sync · v0.6.0</div></div></div><div class="status"><span id="fbDot" class="dot"></span><span id="fbText">Conectando…</span></div></header>
<main><div class="notice"><b>Cámara y audio por Zoom.</b> Promter Risk se conecta automáticamente con producción. No hay códigos, ofertas ni respuestas.</div>
<div class="top"><div><span class="eyebrow">USUARIO</span><h1 id="speakerName"></h1><div id="role" class="muted"></div></div><select id="speakerSelect"></select></div>
<section id="workspace" class="workspace"><div class="livegrid"><article class="card"><span id="axis" class="eyebrow"></span><h2 id="blockTitle"></h2><p id="cueText" class="muted"></p><div id="prompt" class="prompt"></div><div id="ideas" class="ideas"></div><div class="producer"><b>PRODUCCIÓN</b><div id="producerCueText">Esperando instrucción…</div></div></article><aside class="card timer"><span class="eyebrow">TIEMPO</span><div id="timer" class="big">--:--</div><b id="timerLabel">Tiempo</b><div id="next" class="muted" style="margin-top:12px"></div></aside></div>
<div class="tabs"><button class="tab active" data-tab="board">Pizarra</button><button class="tab" data-tab="notes">Notas</button></div>
<section id="boardPanel" class="tabPanel active"><div class="boardgrid"><article class="card"><div class="actions" style="margin-bottom:10px"><button id="pen" class="secondary">Lápiz</button><button id="eraser" class="secondary">Borrador</button><button id="clear" class="danger">Limpiar</button><button id="sendBoard" class="primary">Enviar pizarra a producción</button></div><div class="canvasbox"><canvas id="board"></canvas></div><div id="boardState" class="muted" style="font-size:12px;margin-top:8px">Sin enviar.</div></article><aside class="card"><span class="eyebrow">IDEAS DE APOYO</span><div id="boardIdeas"></div></aside></div></section>
<section id="notesPanel" class="tabPanel"><div class="card"><textarea id="notes" class="notes" placeholder="Notas privadas..."></textarea><div id="noteState" class="muted" style="font-size:12px;margin-top:6px">Guardado localmente.</div></div></section>
</section></main>
<script>
let data=null,speakerId='kervin',fbState={},firebaseSession=null,ctx=null,drawing=false,tool='pen';
const $=id=>document.getElementById(id),qa=s=>[...document.querySelectorAll(s)];
async function waitFB(){for(let i=0;i<100;i++){if(window.PRFB)return true;await new Promise(r=>setTimeout(r,50))}return false}
function d(b,k){return new Date(b.date+'T'+b[k]+':00-05:00')}function fmt(ms){let s=Math.max(0,Math.floor(ms/1000)),m=Math.floor(s/60);s%=60;return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function blocks(){return data.event.blocks.filter(b=>b.people.includes(speakerId))}
function moment(){let now=new Date(),bs=blocks(),c=bs.find(b=>now>=d(b,'start')&&now<d(b,'end')),n=bs.find(b=>now<d(b,'start'));if(c)return{state:'live',b:c,n};if(n)return{state:'wait',b:n,n};return{state:'done',b:bs[bs.length-1],n:null}}
function loadSpeakers(){let s=$('speakerSelect');s.innerHTML='';Object.entries(data.event.speakers).forEach(([id,p])=>{let o=document.createElement('option');o.value=id;o.textContent=p.name;s.appendChild(o)});s.value=speakerId}
function render(){if(!data)return;let p=data.event.speakers[speakerId],m=moment(),b=m.b,now=new Date(),ws=$('workspace');$('speakerName').textContent=p.name;$('role').textContent=p.role;$('axis').textContent=p.axis;$('blockTitle').textContent=b.title;$('cueText').textContent=b.cue;$('prompt').textContent=b.prompt;$('ideas').innerHTML=p.ideas.map(x=>'<div class="idea"><b>'+x[0]+'</b><span>'+x[1]+'</span></div>').join('');$('boardIdeas').innerHTML=p.ideas.map(x=>'<div class="idea"><b>'+x[0]+'</b><span>'+x[1]+'</span></div>').join('');ws.className='workspace';if(m.state==='wait'){$('timer').textContent=fmt(d(b,'start')-now);$('timerLabel').textContent='Falta para tu bloque';$('next').textContent=b.start}else if(m.state==='live'){let rem=d(b,'end')-now;$('timer').textContent=fmt(rem);$('timerLabel').textContent='Tiempo restante';if(rem<=300000&&rem>120000)ws.classList.add('warning');if(rem<=120000)ws.classList.add('dangerState');$('next').textContent=m.n&&m.n.id!==b.id?'Siguiente '+m.n.start:''}else{$('timer').textContent='00:00';$('timerLabel').textContent='Finalizado';$('next').textContent=''}
if(fbState.alert==='warning')ws.classList.add('warning');if(fbState.alert==='danger')ws.classList.add('dangerState');if(fbState.onair&&fbState.speakerId===speakerId)ws.classList.add('onair');$('producerCueText').textContent=(fbState.speakerId===speakerId?(fbState.onair?'AL AIRE · ':'PREPARA · '):'')+(fbState.producerCue||'Esperando instrucción…')}
async function connect(){await waitFB();if(firebaseSession)firebaseSession.unsubscribe?.();firebaseSession=await PRFB.connectPanelist(data.event.id,speakerId,{onState:s=>{fbState=s;render()},onConnected:()=>{$('fbText').textContent='Conectado automáticamente';$('fbDot').className='dot ok'}})}
function noteKey(){return 'pr-note:'+data.event.id+':'+speakerId}
function switchTab(name){qa('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===name));qa('.tabPanel').forEach(x=>x.classList.remove('active'));$(name+'Panel').classList.add('active');if(name==='board')setTimeout(resizeBoard,60)}
function initBoard(){let c=$('board');ctx=c.getContext('2d');resizeBoard();function p(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*(c.width/r.width),y:(e.clientY-r.top)*(c.height/r.height)}}c.onpointerdown=e=>{drawing=true;let q=p(e);ctx.beginPath();ctx.moveTo(q.x,q.y)};c.onpointermove=e=>{if(!drawing)return;let q=p(e);ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=tool==='eraser'?24:3;ctx.strokeStyle=tool==='eraser'?'#fff':'#102133';ctx.lineTo(q.x,q.y);ctx.stroke()};c.onpointerup=c.onpointerleave=()=>drawing=false}
function resizeBoard(){if(!ctx)return;let c=$('board'),r=c.getBoundingClientRect(),old=document.createElement('canvas');old.width=c.width||1;old.height=c.height||1;old.getContext('2d').drawImage(c,0,0);c.width=Math.max(1,Math.round(r.width*devicePixelRatio));c.height=Math.max(1,Math.round(r.height*devicePixelRatio));ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);if(old.width>1)ctx.drawImage(old,0,0,c.width,c.height)}
function clearBoard(){let c=$('board');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height)}
async function sendBoard(){try{$('boardState').textContent='Enviando…';let src=$('board'),tmp=document.createElement('canvas');tmp.width=800;tmp.height=Math.max(450,Math.round(800*(src.height/src.width||.56)));let x=tmp.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,tmp.width,tmp.height);x.drawImage(src,0,0,tmp.width,tmp.height);let dataUrl=tmp.toDataURL('image/jpeg',.68);await PRFB.sendBoard(data.event.id,speakerId,dataUrl);$('boardState').textContent='✓ Pizarra recibida por Firebase · '+new Date().toLocaleTimeString('es-EC')}catch(e){$('boardState').textContent='Error: '+e.message}}
async function init(){data=await (await fetch('./events-v060.json?v='+Date.now(),{cache:'no-store'})).json();let q=new URLSearchParams(location.search).get('panelista');if(q&&data.event.speakers[q])speakerId=q;loadSpeakers();$('speakerSelect').onchange=async e=>{speakerId=e.target.value;let u=new URL(location.href);u.searchParams.set('panelista',speakerId);history.replaceState(null,'',u);$('notes').value=localStorage.getItem(noteKey())||'';await PRFB.setPanelistSpeaker(data.event.id,speakerId);render()};qa('.tab').forEach(x=>x.onclick=()=>switchTab(x.dataset.tab));$('pen').onclick=()=>tool='pen';$('eraser').onclick=()=>tool='eraser';$('clear').onclick=clearBoard;$('sendBoard').onclick=sendBoard;$('notes').value=localStorage.getItem(noteKey())||'';$('notes').oninput=()=>{localStorage.setItem(noteKey(),$('notes').value);$('noteState').textContent='Guardado '+new Date().toLocaleTimeString('es-EC',{hour:'2-digit',minute:'2-digit'})};await connect();initBoard();render();setInterval(render,1000);window.addEventListener('resize',resizeBoard)}
document.addEventListener('DOMContentLoaded',init);
</script></body></html>
