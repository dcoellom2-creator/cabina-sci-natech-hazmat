<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Promter Risk · Vista pública</title>
<style>
:root{--navy:#082b4b;--ink:#102133;--muted:#6b7787;--line:#dde6ee;--bg:#f5f8fb;--amber:#d97706;--green:#20864a;--red:#c73333;--blue:#2563eb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink)}
header{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:#fff;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:14px}.logo{font-weight:950;color:var(--navy);border:1px solid var(--line);border-radius:14px;padding:10px 14px;background:#fff}.brand small{display:block;color:var(--muted)}button,select{font:inherit;border:0;border-radius:12px;padding:10px 13px;font-weight:800;cursor:pointer}.primary{background:var(--navy);color:white}.secondary{background:#eef3f7;color:var(--navy)}select{border:1px solid var(--line);background:#fff;color:var(--ink)}
main{padding:20px;max-width:1600px;margin:auto}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.stage{height:calc(100vh - 126px);min-height:650px;background:#fff;border:1px solid var(--line);border-radius:28px;overflow:hidden;display:grid;grid-template-columns:34% 66%;box-shadow:0 20px 60px rgba(8,43,75,.09)}.panelist{background:linear-gradient(180deg,#0b3154,#061829);color:white;padding:28px;position:relative;display:flex;flex-direction:column;justify-content:space-between}.camwrap{border-radius:24px;background:#0b1520;border:1px solid rgba(255,255,255,.18);height:46%;display:grid;place-items:center;overflow:hidden}.camwrap video{width:100%;height:100%;object-fit:cover}.bubble{width:150px;height:150px;border-radius:999px;background:#fff;color:var(--navy);display:grid;place-items:center;text-align:center;font-weight:900}.panelist h1{font-size:34px;margin:18px 0 6px;line-height:1.05}.axis{display:inline-flex;border-radius:999px;background:rgba(255,255,255,.14);padding:8px 11px;font-size:12px;font-weight:900;letter-spacing:.08em}.role{color:#d9e6ef;line-height:1.4}.timer{font-size:52px;font-weight:950;letter-spacing:-.05em}.alert{position:absolute;inset:0;border:8px solid transparent;border-radius:28px;pointer-events:none}.warning .alert{border-color:var(--amber)}.danger .alert{border-color:var(--red)}.content{padding:34px 42px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(135deg,#ffffff,#f6f9fc)}.tag{color:var(--amber);font-size:12px;font-weight:950;letter-spacing:.13em}.content h2{font-size:44px;line-height:1.02;letter-spacing:-.035em;color:var(--navy);margin:10px 0 18px}.lead{font-size:21px;line-height:1.45;color:#24384f}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0}.card{border:1px solid var(--line);border-radius:18px;padding:16px;background:white;min-height:130px}.card b{display:block;color:var(--navy);font-size:16px;margin-bottom:8px}.card span{color:var(--muted);font-size:14px;line-height:1.4}.question{border-left:6px solid var(--amber);background:#fff7eb;border-radius:0 18px 18px 0;padding:18px 22px;font-size:25px;line-height:1.25;font-weight:900;color:var(--navy)}.source{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}.table{width:100%;border-collapse:collapse;background:#fff;border-radius:16px;overflow:hidden;border:1px solid var(--line);margin:18px 0}.table th,.table td{padding:12px;border-bottom:1px solid var(--line);text-align:left}.table th{color:var(--navy);font-size:13px}.sf{display:inline-flex;background:#fff0f0;color:var(--red);border-radius:999px;padding:6px 10px;font-weight:900}.mode-pizarra .content{background:white}.whiteboard{display:none;height:100%;border:1px solid var(--line);border-radius:22px;background:#fff}.mode-pizarra .slide-content{display:none}.mode-pizarra .whiteboard{display:block}canvas{width:100%;height:100%;display:block;touch-action:none}@media(max-width:900px){.stage{grid-template-columns:1fr;height:auto}.panelist{min-height:380px}.content h2{font-size:34px}.cards{grid-template-columns:1fr}.timer{font-size:42px}}
</style>
</head>
<body>
<header><div class="brand"><div class="logo">CRIGMPAL</div><div class="logo">SAMBIES</div><div><b>Promter Risk · Vista pública</b><small>Escena institucional para transmisión</small></div></div><a href="./" class="secondary" style="text-decoration:none">Volver</a></header>
<main>
<div class="controls"><select id="speaker"></select><select id="slide"></select><button id="cam" class="primary">Activar cámara</button><button id="modeContent" class="secondary">Contenido</button><button id="modeBoard" class="secondary">Pizarra</button><button id="clear" class="secondary">Limpiar pizarra</button><button id="warn" class="secondary">Alerta 5 min</button><button id="danger" class="secondary">Alerta 2 min</button></div>
<section id="stage" class="stage"><aside id="panel" class="panelist"><div class="alert"></div><div><span id="axis" class="axis"></span><h1 id="speakerName"></h1><p id="role" class="role"></p></div><div class="camwrap"><video id="video" autoplay muted playsinline></video><div id="bubble" class="bubble">Cámara<br>opcional</div></div><div><small>Tiempo / conducción</small><div id="timer" class="timer">--:--</div></div></aside><article class="content"><div class="slide-content"><span id="tag" class="tag"></span><h2 id="title"></h2><p id="lead" class="lead"></p><div id="cards" class="cards"></div><div id="tablebox"></div><div id="question" class="question"></div></div><div class="whiteboard"><canvas id="board"></canvas></div><div id="source" class="source"></div></article></section>
</main>
<script>
let data, stream, drawing=false, ctx;
const $=id=>document.getElementById(id);
async function init(){data=await (await fetch('./events.json?v='+Date.now())).json();loadSelectors();bind();render();initBoard();setInterval(tick,1000)}
function loadSelectors(){const ss=$('speaker');ss.innerHTML='';Object.entries(data.event.speakers).forEach(([id,s])=>{let o=document.createElement('option');o.value=id;o.textContent=s.name;ss.appendChild(o)});ss.value='kervin';const sl=$('slide');sl.innerHTML='';(data.event.publicSlides||[]).forEach((p,i)=>{let o=document.createElement('option');o.value=i;o.textContent=(i+1)+' · '+p.title;sl.appendChild(o)})}
function bind(){$('speaker').onchange=render;$('slide').onchange=render;$('cam').onclick=startCam;$('modeContent').onclick=()=>stageMode('contenido');$('modeBoard').onclick=()=>stageMode('pizarra');$('clear').onclick=clearBoard;$('warn').onclick=()=>alertState('warning');$('danger').onclick=()=>alertState('danger')}
function render(){const s=data.event.speakers[$('speaker').value];const p=(data.event.publicSlides||[])[$('slide').value]||{};$('axis').textContent=s.axis;$('speakerName').textContent=s.name;$('role').textContent=s.role;$('tag').textContent=p.tag||'CONTENIDO TÉCNICO';$('title').textContent=p.title||'';$('lead').textContent=p.lead||'';$('cards').innerHTML=(p.cards||[]).map(c=>'<div class="card"><b>'+c[0]+'</b><span>'+c[1]+'</span></div>').join('');$('question').textContent=p.question||'';$('source').textContent=p.source||'';$('tablebox').innerHTML=p.table?'<table class="table"><thead><tr>'+p.table.headers.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+p.table.rows.map(r=>'<tr>'+r.map((x,i)=>'<td>'+(i==1?'<span class="sf">'+x+'</span>':x)+'</td>').join('')+'</tr>').join('')+'</tbody></table>':'';}
async function startCam(){try{stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});$('video').srcObject=stream;$('bubble').style.display='none'}catch(e){alert('No se pudo activar la cámara: '+e.message)}}
function stageMode(m){$('stage').classList.toggle('mode-pizarra',m==='pizarra');setTimeout(resizeBoard,80)}function alertState(c){$('panel').classList.remove('warning','danger');if(c)$('panel').classList.add(c)}
function tick(){const now=new Date();$('timer').textContent=now.toLocaleTimeString('es-EC',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false,timeZone:'America/Guayaquil'})}
function initBoard(){const canvas=$('board');ctx=canvas.getContext('2d');resizeBoard();const pt=e=>{let r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*(canvas.width/r.width),y:(e.clientY-r.top)*(canvas.height/r.height)}};canvas.onpointerdown=e=>{drawing=true;let p=pt(e);ctx.beginPath();ctx.moveTo(p.x,p.y)};canvas.onpointermove=e=>{if(!drawing)return;let p=pt(e);ctx.lineWidth=3;ctx.lineCap='round';ctx.strokeStyle='#102133';ctx.lineTo(p.x,p.y);ctx.stroke()};canvas.onpointerup=canvas.onpointerleave=()=>drawing=false;window.onresize=resizeBoard}
function resizeBoard(){const c=$('board');if(!c||!ctx)return;let r=c.getBoundingClientRect();c.width=Math.max(1,Math.round(r.width*devicePixelRatio));c.height=Math.max(1,Math.round(r.height*devicePixelRatio));clearBoard()}function clearBoard(){if(!ctx)return;ctx.fillStyle='#fff';ctx.fillRect(0,0,$('board').width,$('board').height)}
document.addEventListener('DOMContentLoaded',init);
</script>
</body></html>
