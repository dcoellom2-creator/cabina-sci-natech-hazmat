<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Control Conversatorio CRIGMPAL</title>
  <style>
    :root{
      --navy:#082b4b; --navy2:#041827; --orange:#f28a22; --teal:#169399; --green:#3e9a47; --purple:#5b4ba4; --red:#c43b3b; --bg:#eef4f8; --card:#ffffff; --ink:#132033; --muted:#657286; --line:#d7e2eb;
    }
    *{box-sizing:border-box}
    body{margin:0;background:linear-gradient(135deg,#eaf2f8,#ffffff);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink)}
    header{position:sticky;top:0;z-index:20;background:rgba(4,24,39,.96);color:#fff;border-bottom:4px solid var(--orange);box-shadow:0 6px 20px rgba(0,0,0,.18)}
    .top{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:12px 18px;max-width:1360px;margin:auto}
    .brand{display:flex;gap:12px;align-items:center}.mark{width:42px;height:42px;border-radius:10px;background:#fff;color:var(--navy);display:grid;place-items:center;font-weight:900}.brand h1{font-size:18px;margin:0}.brand p{font-size:12px;margin:2px 0 0;color:#d6e6f4}.clock{text-align:right}.clock b{font-size:24px}.clock small{display:block;color:#c4d5e3}
    nav{display:flex;gap:8px;max-width:1360px;margin:auto;padding:0 18px 12px;overflow:auto}.tab{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;padding:8px 14px;cursor:pointer;white-space:nowrap;font-weight:700}.tab.active{background:var(--orange);border-color:var(--orange);color:#111}
    main{max-width:1360px;margin:18px auto;padding:0 18px 80px}.view{display:none}.view.active{display:block}.grid{display:grid;gap:16px}.cols-2{grid-template-columns:1.2fr .8fr}.cols-3{grid-template-columns:repeat(3,1fr)}@media(max-width:900px){.cols-2,.cols-3{grid-template-columns:1fr}.clock b{font-size:18px}}
    .card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 28px rgba(8,43,75,.08);padding:16px}.card h2,.card h3{margin:0 0 10px}.muted{color:var(--muted)}.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 10px;font-weight:800;font-size:12px;background:#edf3f7;color:var(--navy)}.pill.orange{background:#fff1df;color:#9c5305}.pill.teal{background:#e3f8f8;color:#0d6b70}.pill.green{background:#e8f6e9;color:#236b2a}.pill.purple{background:#eeebff;color:#46358a}.pill.red{background:#ffe8e8;color:#a62c2c}
    button{border:0;border-radius:12px;background:var(--navy);color:#fff;padding:10px 14px;font-weight:800;cursor:pointer}button.secondary{background:#e9eff5;color:var(--navy)}button.orange{background:var(--orange);color:#111}button.red{background:var(--red)}button.green{background:var(--green)}button:disabled{opacity:.5;cursor:not-allowed}
    .block{border:1px solid var(--line);border-radius:14px;background:#fff;margin:8px 0;padding:12px;display:grid;grid-template-columns:110px 1fr 120px 120px;gap:10px;align-items:center}.block.active{outline:3px solid var(--orange);box-shadow:0 0 0 6px #ffecce}.block.done{opacity:.62}.block .time{font-weight:900;color:var(--navy)}.block .who{font-weight:900}.block .title{font-weight:800}.block .dur{text-align:right}.block button{padding:8px 10px}@media(max-width:760px){.block{grid-template-columns:1fr}.block .dur{text-align:left}}
    .timer{display:grid;grid-template-columns:1fr 1fr;gap:12px}.timer .big{font-size:64px;font-weight:950;letter-spacing:-2px;color:var(--navy);line-height:1}.timer .big.warn{color:var(--orange)}.timer .big.danger{color:var(--red)}.progress{height:16px;background:#e5edf3;border-radius:20px;overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--orange),var(--red));width:0%}
    .cue{font-size:30px;line-height:1.18;font-weight:800;color:var(--navy);background:#fff;border-radius:18px;padding:22px;border:2px dashed #cbd9e5}.cue.small{font-size:20px}.list{margin:0;padding-left:18px}.list li{margin:7px 0}.warnbox{border-left:6px solid var(--orange);background:#fff7eb;padding:12px;border-radius:10px}.dangerbox{border-left:6px solid var(--red);background:#fff0f0;padding:12px;border-radius:10px}.okbox{border-left:6px solid var(--green);background:#f0fff2;padding:12px;border-radius:10px}
    textarea,input,select{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px;font:inherit}textarea{min-height:110px}.speaker{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center}.avatar{width:72px;height:72px;border-radius:18px;background:linear-gradient(135deg,var(--navy),var(--teal));display:grid;place-items:center;color:#fff;font-weight:950;font-size:24px}.kpi{display:flex;gap:8px;flex-wrap:wrap}.service{border-left:5px solid var(--orange);padding-left:10px}.print{display:none}@media print{header,nav,button,.no-print{display:none!important}main{max-width:none}.view{display:block}.print{display:block}.card{break-inside:avoid;box-shadow:none}}
    .footerbar{position:fixed;bottom:0;left:0;right:0;background:#071d31;color:#fff;padding:10px 18px;display:flex;gap:12px;align-items:center;justify-content:center;z-index:30;box-shadow:0 -5px 18px rgba(0,0,0,.22)}.footerbar a{color:#ffd28a}.dot{width:10px;height:10px;border-radius:50%;background:#4caf50;display:inline-block}
  </style>
</head>
<body>
<header>
  <div class="top">
    <div class="brand"><div class="mark">CR</div><div><h1>Control Conversatorio CRIGMPAL</h1><p>Prompter · tiempos · alarmas · guion · servicios · evidencias</p></div></div>
    <div class="clock"><b id="now">--:--</b><small>Hora Ecuador · <span id="dateNow"></span></small></div>
  </div>
  <nav id="tabs"></nav>
</header>
<main>
  <section id="dashboard" class="view active"></section>
  <section id="prompter" class="view"></section>
  <section id="timeline" class="view"></section>
  <section id="speakers" class="view"></section>
  <section id="services" class="view"></section>
  <section id="quality" class="view"></section>
  <section id="clips" class="view"></section>
</main>
<div class="footerbar no-print"><span class="dot"></span><span id="statusLine">Listo para operar.</span><a href="https://ee.kobotoolbox.org/x/mCtgyzHs" target="_blank">Registro Kobo</a></div>
<script>
const registrationURL='https://ee.kobotoolbox.org/x/mCtgyzHs';
const speakers={
  kervin:{name:'PhD. Kervin Chunga',role:'Geólogo investigador',axis:'CONOCER',color:'teal',cue:'Base técnica y evidencia territorial',prompt:'¿Qué pasa cuando creemos que gestionamos el riesgo con formatos, pero la base técnica no alcanza?',messages:['Formato no es gestión.','La base técnica define la calidad de la decisión.','La evidencia debe llegar al sistema de decisión, no quedarse en el PDF.'],clips:['Formato no es gestión','Base técnica antes de decidir','La evidencia debe entrar a la gestión'],service:'Estudios especializados, cartografía, amenaza, susceptibilidad y lectura técnica territorial.'},
  daniel:{name:'MSc. Daniel Coello',role:'Geólogo / Gestión de riesgos',axis:'DECIDIR',color:'orange',cue:'Del dato técnico a la gestión',prompt:'¿En qué momento el conocimiento del territorio deja de ser información y empieza realmente a convertirse en gestión?',messages:['No gestionamos mapas; gestionamos decisiones.','La cadena debe cerrar: fuente → decisión → responsable → evidencia.','El PDF no puede ser el único sistema de gestión.'],clips:['No gestionamos mapas','Del dato al responsable','El PDF no puede ser el sistema'],service:'Diagnóstico territorial, hoja de ruta, SIG, tablero, planes, asistencia técnica e implementación.'},
  patricio:{name:'MSc. Patricio Cobo',role:'Ing. Ambiental / Gestión de riesgos',axis:'ACTUAR',color:'green',cue:'Territorio, preparación y comunidad',prompt:'¿Qué debe ocurrir para que una comunidad esté preparada y no solamente tenga un plan?',messages:['Plan no es capacidad instalada.','La preparación se diseña según el riesgo real del territorio.','Comités, SAT, ejercicios y retroalimentación sostienen la acción.'],clips:['Plan vs capacidad','Capacitar según el riesgo real','La gestión se comprueba en territorio'],service:'Fortalecimiento comunitario, SAT, comités, capacitaciones, simulacros y ejercicios.'},
  xavier:{name:'MSc. Xavier Verdezoto',role:'Gestión de riesgo y emergencia / Prefectura de Bolívar',axis:'ARTICULAR',color:'purple',cue:'Gobernanza del riesgo',prompt:'Cuando todos tienen responsabilidad en el riesgo, ¿qué hace que esa responsabilidad realmente se articule?',messages:['Gobernanza no es reunión: es continuidad y responsabilidad.','Competencias, recursos y actores deben conectarse con evidencia.','Sin gobernanza, la implementación depende de personas y no del sistema.'],clips:['Gobernanza no es reunión','Responsabilidad compartida','Articular para sostener'],service:'Asesoría institucional, modelos de gobernanza, coordinación y acompañamiento de implementación.'}
};
const schedule=[
 {id:'d1a',day:'Día 1',time:'18:00',min:8,who:'Daniel',title:'Apertura y encuadre',cue:'Presentar hilo: conocer → decidir → actuar → articular. Reglas del conversatorio: técnico, no político, no venta directa.',prompt:'Hoy no venimos a acumular conceptos. Venimos a preguntarnos cómo el conocimiento del riesgo termina en decisiones y acciones.'},
 {id:'d1b',day:'Día 1',time:'18:08',min:27,who:'Kervin',speaker:'kervin',title:'Base técnica y evidencia',cue:'Estudios, mapas, riesgo, trámite vs gestión.',prompt:'¿Estamos gestionando el riesgo o solamente cumpliendo un trámite?'},
 {id:'d1c',day:'Día 1',time:'18:35',min:10,who:'Daniel + Kervin',title:'Diálogo técnico',cue:'Extraer cuatro elementos mínimos que necesita una decisión territorial.',prompt:'Kervin, si mañana este estudio entra a un municipio, ¿qué dato no debería perderse?'},
 {id:'d1d',day:'Día 1',time:'18:45',min:35,who:'Daniel',speaker:'daniel',title:'Del dato técnico a la decisión',cue:'Cruce territorial, competencias, responsables, medidas y evidencia.',prompt:'No gestionamos mapas; gestionamos las decisiones que esos mapas obligan a tomar.'},
 {id:'d1e',day:'Día 1',time:'19:20',min:22,who:'Todos',title:'Informes, proyectos y financiamiento',cue:'Dolor central: llenar formatos no reemplaza base técnica suficiente.',prompt:'¿Qué brecha impide pasar de un reporte a una intervención financiable y defendible?'},
 {id:'d1f',day:'Día 1',time:'19:42',min:10,who:'Público',title:'Preguntas del público',cue:'Capturar necesidades reales, sin resolver asesorías completas en vivo.',prompt:'Ese caso merece revisar información específica; aquí diferenciamos orientación general de asesoría aplicada.'},
 {id:'d1g',day:'Día 1',time:'19:52',min:8,who:'Daniel',title:'Cierre día 1',cue:'Lo que conocemos condiciona lo que podemos decidir. Puente al día 2.',prompt:'Mañana bajamos esa decisión al territorio y a la gobernanza.'},
 {id:'d2a',day:'Día 2',time:'18:00',min:7,who:'Daniel',title:'Recapitulación día 1',cue:'Reenganchar al público en 1 lámina.',prompt:'Ayer hablamos de base técnica y decisión; hoy vemos si eso se convierte en capacidad y articulación.'},
 {id:'d2b',day:'Día 2',time:'18:07',min:25,who:'Patricio',speaker:'patricio',title:'Preparación y comunidad',cue:'Actores, comités, capacitación, SAT, ejercicios, respuesta.',prompt:'¿Qué hace que una comunidad esté preparada y no solamente tenga un plan?'},
 {id:'d2c',day:'Día 2',time:'18:32',min:15,who:'Daniel + Patricio',title:'Diálogo territorio',cue:'Del documento a la capacidad instalada.',prompt:'¿Qué información debe llegar a la comunidad y cuál debe quedarse como insumo técnico?'},
 {id:'d2d',day:'Día 2',time:'18:47',min:30,who:'Xavier',speaker:'xavier',title:'Gobernanza del riesgo',cue:'Competencias, coordinación, responsabilidades, continuidad.',prompt:'Cuando todos tienen responsabilidad, ¿qué hace que realmente se articulen?'},
 {id:'d2e',day:'Día 2',time:'19:17',min:20,who:'Todos',title:'Pregunta transversal',cue:'Kervin: conocer · Daniel: decidir · Patricio: actuar · Xavier: articular.',prompt:'Si ya conocemos el riesgo, ¿qué nos falta para tomar buenas decisiones y actuar realmente sobre él?'},
 {id:'d2f',day:'Día 2',time:'19:37',min:10,who:'Todos',title:'Caso integrador',cue:'Amenaza + población + instituciones + intervención que no avanza.',prompt:'¿Qué haría cada uno desde su rol para destrabar este caso?'},
 {id:'d2g',day:'Día 2',time:'19:47',min:7,who:'Daniel',title:'Ruta de soluciones',cue:'Catálogo: diagnóstico, asesoría, capacitación, implementación.',prompt:'Si su institución enfrenta una brecha concreta, el siguiente paso es revisar su caso.'},
 {id:'d2h',day:'Día 2',time:'19:54',min:6,who:'Daniel',title:'Cierre final',cue:'Agradecer, QR, próximos pasos, seguimiento.',prompt:'Evidencia que no circula no se convierte en decisión; decisión sin responsable no se convierte en gestión; gestión sin territorio no reduce riesgo.'}
];
const tabs=[['dashboard','Panel'],['prompter','Prompter'],['timeline','Tiempos'],['speakers','Ponentes'],['services','Servicios'],['quality','Calidad'],['clips','Clips']];
let activeId=localStorage.getItem('activeBlock')||schedule[0].id;let startedAt=parseInt(localStorage.getItem('startedAt')||'0');let timerInt=null;let alarmed={};
function $(id){return document.getElementById(id)}function pad(n){return String(n).padStart(2,'0')}function nowTick(){const d=new Date();$('now').textContent=pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());$('dateNow').textContent=d.toLocaleDateString('es-EC',{weekday:'long',day:'2-digit',month:'short'});}setInterval(nowTick,1000);nowTick();
function setStatus(txt){$('statusLine').textContent=txt}
function beep(type='warn'){try{const AudioContext=window.AudioContext||window.webkitAudioContext;const ctx=new AudioContext();const osc=ctx.createOscillator();const gain=ctx.createGain();osc.connect(gain);gain.connect(ctx.destination);osc.frequency.value=type==='danger'?880:520;gain.gain.value=.09;osc.start();setTimeout(()=>{osc.stop();ctx.close()},type==='danger'?650:350)}catch(e){}}
function notify(txt){if('Notification'in window&&Notification.permission==='granted')new Notification('CRIGMPAL Control',{body:txt});}
function requestNotify(){if('Notification'in window)Notification.requestPermission();}
function switchTab(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.id===id));renderAll();}
function renderTabs(){const nav=$('tabs');nav.innerHTML='';tabs.forEach(([id,label])=>{const b=document.createElement('button');b.className='tab'+(id==='dashboard'?' active':'');b.dataset.id=id;b.textContent=label;b.onclick=()=>switchTab(id);nav.appendChild(b);});}
function activeBlock(){return schedule.find(b=>b.id===activeId)||schedule[0]}
function startBlock(id){activeId=id;startedAt=Date.now();alarmed={};localStorage.setItem('activeBlock',id);localStorage.setItem('startedAt',startedAt);setStatus('Bloque iniciado: '+activeBlock().title);beep('warn');renderAll();}
function stopBlock(){startedAt=0;localStorage.removeItem('startedAt');setStatus('Temporizador pausado.');renderAll();}
function nextBlock(){const i=schedule.findIndex(b=>b.id===activeId);if(i<schedule.length-1)startBlock(schedule[i+1].id)}
function elapsedSec(){return startedAt?Math.floor((Date.now()-startedAt)/1000):0}
function remainingSec(){return activeBlock().min*60-elapsedSec()}
function renderDashboard(){const b=activeBlock();const rem=remainingSec();const total=b.min*60;const pct=startedAt?Math.min(100,Math.max(0,elapsedSec()/total*100)):0;let cls=rem<=120?'danger':rem<=300?'warn':'';
$('dashboard').innerHTML=`<div class="grid cols-2"><div class="card"><div class="kpi"><span class="pill ${b.speaker?speakers[b.speaker].color:''}">${b.day}</span><span class="pill orange">${b.time}</span><span class="pill">${b.who}</span><span class="pill red">${b.min} min</span></div><h2>${b.title}</h2><p class="muted">${b.cue}</p><div class="cue">${b.prompt}</div><div style="margin:14px 0" class="progress"><span style="width:${pct}%"></span></div><div class="timer"><div><div class="big ${cls}">${Math.max(0,Math.floor(rem/60))}:${pad(Math.max(0,rem%60))}</div><p class="muted">Tiempo restante</p></div><div><div class="big">${Math.floor(elapsedSec()/60)}:${pad(elapsedSec()%60)}</div><p class="muted">Transcurrido</p></div></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="green" onclick="startBlock('${b.id}')">Iniciar bloque</button><button class="secondary" onclick="stopBlock()">Pausar</button><button class="orange" onclick="nextBlock()">Siguiente</button><button class="secondary" onclick="requestNotify()">Activar notificaciones</button></div></div><div class="card"><h3>Alertas críticas</h3><div class="warnbox"><b>-5 min:</b> preparar cierre del ponente o pregunta puente.</div><br><div class="dangerbox"><b>-2 min:</b> cortar con frase de transición.</div><br><div class="okbox"><b>Regla comercial:</b> el contenido genera la necesidad; catálogo solo al final.</div><h3 style="margin-top:18px">Bloque siguiente</h3>${nextPreview()}</div></div>`;}
function nextPreview(){const i=schedule.findIndex(b=>b.id===activeId);const n=schedule[i+1];return n?`<p><b>${n.time} · ${n.title}</b><br><span class="muted">${n.who} · ${n.cue}</span></p>`:'<p>Último bloque.</p>'}
function renderPrompter(){const b=activeBlock();const sp=b.speaker?speakers[b.speaker]:null;const rem=remainingSec();$('prompter').innerHTML=`<div class="card"><div class="kpi"><span class="pill orange">PROMPTER</span><span class="pill">${b.day}</span><span class="pill red">${b.min} min</span></div><h2>${b.title}</h2><div class="cue">${b.prompt}</div><h3>Qué debo hacer ahora</h3><ul class="list"><li>${b.cue}</li><li>Mirar el reloj: ${Math.max(0,Math.floor(rem/60))}:${pad(Math.max(0,rem%60))} restantes.</li><li>Si aparece una pregunta compleja, convertirla en necesidad de seguimiento, no resolver consultoría completa en vivo.</li></ul>${sp?`<h3>${sp.name}</h3><ul class="list">${sp.messages.map(m=>`<li>${m}</li>`).join('')}</ul>`:''}<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px"><button onclick="startBlock('${b.id}')">Iniciar</button><button class="orange" onclick="nextBlock()">Siguiente bloque</button><button class="secondary" onclick="window.print()">Imprimir tarjetas</button></div></div>`;}
function renderTimeline(){let html='<div class="card"><h2>Línea de tiempo editable de operación</h2><p class="muted">Selecciona un bloque para activar el prompter y las alarmas.</p>';schedule.forEach((b,i)=>{html+=`<div class="block ${b.id===activeId?'active':''} ${schedule.findIndex(x=>x.id===activeId)>i?'done':''}"><div class="time">${b.day}<br>${b.time}</div><div><div class="title">${b.title}</div><div class="muted">${b.who} · ${b.cue}</div></div><div class="dur">${b.min} min</div><button onclick="startBlock('${b.id}')">Activar</button></div>`});html+='</div>';$('timeline').innerHTML=html;}
function renderSpeakers(){let html='<div class="grid cols-2">';Object.values(speakers).forEach(sp=>{html+=`<div class="card"><div class="speaker"><div class="avatar">${sp.name.split(' ')[1][0]}</div><div><span class="pill ${sp.color}">${sp.axis}</span><h3>${sp.name}</h3><p class="muted">${sp.role}</p></div></div><h3>${sp.cue}</h3><p><b>Pregunta:</b> ${sp.prompt}</p><ul class="list">${sp.messages.map(m=>`<li>${m}</li>`).join('')}</ul><div class="service"><b>Servicio relacionado:</b><br>${sp.service}</div></div>`});html+='</div>';$('speakers').innerHTML=html;}
function renderServices(){$('services').innerHTML=`<div class="grid cols-2"><div class="card"><h2>Catálogo de soluciones</h2><p class="muted">No vender durante cada bloque; mostrar brechas y cerrar con ruta de acompañamiento.</p><ul class="list"><li><b>Diagnóstico inicial:</b> revisión 60–90 min del caso y hoja de ruta.</li><li><b>Asesoría personalizada:</b> acompañamiento puntual por problema.</li><li><b>Capacitación:</b> cursos cortos según brecha real.</li><li><b>Implementación:</b> SIG, tablero, SAT, comités, planes, gobernanza.</li></ul></div><div class="card"><h2>Frase de cierre comercial</h2><div class="cue small">“Si su institución enfrenta una brecha concreta, no necesita otra charla general: necesita revisar su caso con información técnica, responsables y una hoja de ruta.”</div><p><a href="${registrationURL}" target="_blank">Abrir registro / interés</a></p></div></div>`;}
function renderQuality(){const checks=['Probar link y QR desde celular sin sesión iniciada.','Confirmar nombres y títulos antes de publicar.','No modificar Kobo de registro básico en plena difusión.','Separar registro, evaluación y seguimiento en fases.','Guardar bruto → editado → publicado → métricas → lección aprendida.','No usar el conversatorio como ataque político; enfoque técnico y de capacidades.'];let stored=JSON.parse(localStorage.getItem('checks')||'{}');let html='<div class="card"><h2>Control de calidad y lecciones aprendidas</h2>';checks.forEach((c,i)=>{html+=`<label style="display:flex;gap:10px;align-items:flex-start;margin:12px 0"><input type="checkbox" ${stored[i]?'checked':''} onchange="saveCheck(${i},this.checked)" style="width:auto;margin-top:4px"><span>${c}</span></label>`});html+='<h3>Registro rápido de incidente</h3><textarea id="incident" placeholder="Ej.: link difundido con error / formulario cambiado en producción / variable congelada modificada"></textarea><br><button class="orange" onclick="saveIncident()">Guardar incidente local</button><div id="incidents"></div></div>';$('quality').innerHTML=html;renderIncidents();}
function saveCheck(i,val){let s=JSON.parse(localStorage.getItem('checks')||'{}');s[i]=val;localStorage.setItem('checks',JSON.stringify(s));}
function saveIncident(){const t=$('incident').value.trim();if(!t)return;let arr=JSON.parse(localStorage.getItem('incidents')||'[]');arr.unshift({t,at:new Date().toLocaleString('es-EC')});localStorage.setItem('incidents',JSON.stringify(arr));$('incident').value='';renderIncidents();}
function renderIncidents(){const el=$('incidents');if(!el)return;const arr=JSON.parse(localStorage.getItem('incidents')||'[]');el.innerHTML=arr.map(x=>`<div class="dangerbox" style="margin-top:8px"><b>${x.at}</b><br>${x.t}</div>`).join('')}
function renderClips(){let html='<div class="card"><h2>Banco de clips y microcontenidos</h2><p class="muted">Provocar frases autocontenidas de 30–60 segundos.</p></div><div class="grid cols-2">';Object.values(speakers).forEach(sp=>{html+=`<div class="card"><span class="pill ${sp.color}">${sp.name}</span><h3>Ideas clip</h3><ul class="list">${sp.clips.map(c=>`<li>${c}</li>`).join('')}</ul><textarea placeholder="Anota minuto de grabación, frase exacta o idea de reel"></textarea></div>`});html+='</div>';$('clips').innerHTML=html;}
function renderAll(){renderDashboard();renderPrompter();renderTimeline();renderSpeakers();renderServices();renderQuality();renderClips();}
function timerLoop(){if(startedAt){const rem=remainingSec();if(rem===300&&!alarmed[300]){beep('warn');notify('Quedan 5 minutos: preparar cierre');alarmed[300]=true}if(rem===120&&!alarmed[120]){beep('danger');notify('Quedan 2 minutos: cerrar y transicionar');alarmed[120]=true}if(rem<=0&&!alarmed[0]){beep('danger');notify('Tiempo terminado: pasar al siguiente bloque');alarmed[0]=true}renderDashboard();renderPrompter();}}setInterval(timerLoop,1000);
renderTabs();renderAll();
</script>
</body>
</html>
