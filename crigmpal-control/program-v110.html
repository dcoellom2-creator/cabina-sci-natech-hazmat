63GlN5BQW086ed56dHqMK7NtxgFtFjhwYbgV+cHpOwk+nH+nJm8KamampmtrnsL2LDWdAftcwOGnKkbzB1hbE9xP3P8wCyyM2lKLbre/6AAAAA"></div><div style="margin-top:3vh"><span id="axis" class="axis"></span></div></div><div><iframe id="cameraFrame" class="camera-frame" title="Cámara del panelista" allow="camera; microphone; autoplay; fullscreen"></iframe><div id="avatar" class="avatar">KC</div><div id="cameraStatus" class="camera-status">Esperando señal de cámara…</div><h1 id="speakerName">Panelista</h1><div id="role" class="role"></div></div><div class="speaker-bottom"><small>CONVERSATORIO TÉCNICO</small><div id="livecue" class="livecue">Conocer el riesgo para decidir y actuar</div></div></aside><article class="content"><div id="nativePresentation"></div><div><span id="tag" class="tag"></span><h2 id="title"></h2><p id="lead" class="lead"></p><div id="cards" class="cards"></div><div id="tablebox" class="tablewrap"></div><canvas id="remoteBoard" class="remote-board"></canvas><img id="remoteBoardImage" class="remote-board-image" alt="Pizarra remota"><div id="question" class="question"></div></div><div id="source" class="source"></div></article><section id="multiStage"></section><div class="alertframe"></div></div>
<script>
let data=null,previewMode=new URLSearchParams(location.search).get('preview')==='1',boardCtx=null,boardDrawing=false,boardTool='pen',boardEvents=[],lastState=null,lastBoardImage='',mqttClient=null,currentCameraId='';const $=id=>document.getElementById(id);const liveChannel='BroadcastChannel' in window?new BroadcastChannel('promter-risk-live'):null;
async function init(){initRemoteBoard();data=await (await fetch('./events-v110.json?v='+Date.now(),{cache:'no-store'})).json();$('programPdfFile').onchange=e=>{let file=e.target.files?.[0];if(file)importPdfHere(file);e.target.value=''};try{let bc=new BroadcastChannel('promter-risk-deck');bc.onmessage=e=>{if(e.data?.type==='PR_DECK_UPDATED'&&lastState){exactPdf=null;exactPdfLoad=null;let sc=scenes()[Number(lastState.sceneIndex)]||{};if(sc.layout==='presentation')renderPresentation(sc)}}}catch(e){}if(previewMode){window.addEventListener('message',e=>{if(e.data?.type==='PR_PREVIEW')render(e.data.state)});render({sceneIndex:0,speakerId:'kervin',alert:'',black:false})}else{initMQTT();loadProgram();window.addEventListener('storage',e=>{if(e.key==='pr_program_state')loadProgram()});if(window.opener&&!window.opener.closed)window.opener.postMessage({type:'PR_PROGRAM_READY'},location.origin)}}

function initMQTT(){let base=data.realtime.topicBase,id='prprog_'+Math.random().toString(16).slice(2,10);mqttClient=mqtt.connect(data.realtime.broker,{clientId:id,clean:true,connectTimeout:5000,reconnectPeriod:1500,keepalive:20});mqttClient.on('connect',()=>mqttClient.subscribe([base+'/state',base+'/board/+']));mqttClient.on('message',(topic,payload)=>{let obj;try{obj=JSON.parse(payload.toString())}catch(e){return}if(topic===base+'/state'){render(obj);localStorage.setItem('pr_program_state',JSON.stringify(obj))}if(topic.startsWith(base+'/board/')&&obj?.data){lastBoardImage=obj.data;$('remoteBoardImage').src=obj.data;$('stage').classList.add('has-board-image');if(lastState)render(lastState)}})}
window.setRemoteStream=function(){/* legacy compatibility: v0.11.3 uses VDO.Ninja */}
function initRemoteBoard(){let c=$('remoteBoard');boardCtx=c.getContext('2d');resizeRemoteBoard();window.addEventListener('resize',resizeRemoteBoard)}
function resizeRemoteBoard(){if(!boardCtx)return;let c=$('remoteBoard'),r=c.getBoundingClientRect(),w=r.width||Math.max(640,window.innerWidth*.58),h=r.height||Math.max(360,window.innerHeight*.58);c.width=Math.max(1,Math.round(w*devicePixelRatio));c.height=Math.max(1,Math.round(h*devicePixelRatio));boardCtx=c.getContext('2d');boardCtx.fillStyle='#fff';boardCtx.fillRect(0,0,c.width,c.height);let copy=boardEvents.slice();boardDrawing=false;copy.forEach(m=>applyBoard(m,false))}
function applyBoard(msg,record=true){if(!boardCtx)return;if(record){if(msg.a==='clear')boardEvents=[];else{boardEvents.push(msg);if(boardEvents.length>12000)boardEvents=boardEvents.slice(-10000)}}let c=$('remoteBoard'),x=(msg.x||0)*c.width,y=(msg.y||0)*c.height;if(msg.a==='clear'){boardCtx.fillStyle='#fff';boardCtx.fillRect(0,0,c.width,c.height);boardDrawing=false;return}if(msg.a==='start'){boardTool=msg.tool||'pen';boardDrawing=true;boardCtx.beginPath();boardCtx.moveTo(x,y);return}if(msg.a==='move'&&boardDrawing){boardTool=msg.tool||boardTool;boardCtx.lineCap='round';boardCtx.lineJoin='round';boardCtx.lineWidth=boardTool==='eraser'?28:4;boardCtx.strokeStyle=boardTool==='eraser'?'#fff':'#102133';boardCtx.lineTo(x,y);boardCtx.stroke();return}if(msg.a==='end'){boardDrawing=false}}
function handleLiveMessage(m){if(!m)return;if(m.type==='PR_REMOTE_BOARD')applyBoard(m.payload);if(m.type==='PR_REMOTE_BOARD_IMAGE'&&m.data){lastBoardImage=m.data;$('remoteBoardImage').src=m.data;let st=$('stage');st.classList.add('has-board-image')}if(m.type==='PR_PROGRAM_STATE'&&m.state)render(m.state)}
if(liveChannel)liveChannel.onmessage=e=>handleLiveMessage(e.data);
window.addEventListener('message',e=>{if(e.origin!==location.origin&&e.origin!=='null')return;handleLiveMessage(e.data)});

function scenes(){return data.event.productionScenes||data.event.publicSlides||[]}
function initials(name){return name.replace(/^(PhD\.|MSc\.|Ing\.)\s*/,'').split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()}
function loadProgram(){let raw=localStorage.getItem('pr_program_state');if(!raw){render({sceneIndex:0,speakerId:'kervin',alert:'',black:false});return}try{render(JSON.parse(raw))}catch(e){}}
function setCamera(sp){let f=$('cameraFrame'),sid=sp.cameraStreamId||'';if(!sid){f.removeAttribute('src');$('cameraStatus').textContent='Sin cámara configurada';$('stage').classList.remove('has-camera');return}if(currentCameraId!==sid){currentCameraId=sid;f.src=sp.cameraViewUrl||('https://vdo.ninja/?view='+encodeURIComponent(sid)+'&cleanoutput&noaudio&cover');$('cameraStatus').textContent='Cámara web · VDO.Ninja';}$('stage').classList.add('has-camera')}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function viewUrl(sp){return sp?.cameraViewUrl||('https://vdo.ninja/?view='+encodeURIComponent(sp?.cameraStreamId||'')+'&cleanoutput&noaudio&cover&autoplay')}
function activeFlow(sc,st){let flow=sc.questionFlow||[],i=Math.max(0,Math.min(flow.length-1,Number(st.questionIndex||0)));return {flow,i,q:flow[i]||{}}}
let exactPdf=null,exactPdfLoad=null,exactRenderToken=0;
if(window.pdfjsLib){pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'}
function openDeckDB(){return new Promise((resolve,reject)=>{let q=indexedDB.open('promter-risk-decks',1);q.onupgradeneeded=()=>{let db=q.result;if(!db.objectStoreNames.contains('assets'))db.createObjectStore('assets')};q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}
async function deckGet(key){let db=await openDeckDB();return new Promise((res,rej)=>{let q=db.transaction('assets').objectStore('assets').get(key);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function deckPut(key,val){let db=await openDeckDB();return new Promise((res,rej)=>{let tx=db.transaction('assets','readwrite');tx.objectStore('assets').put(val,key);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
async function importPdfHere(file){
  const sc=lastState?scenes()[Number(lastState.sceneIndex)]||{}:{};
  try{
    if(!file||!(file.type==='application/pdf'||/\.pdf$/i.test(file.name)))throw new Error('Selecciona un PDF');
    const buf=await file.arrayBuffer();
    if(!window.pdfjsLib)throw new Error('PDF.js no está disponible');
    const pdf=await pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise;
    if(pdf.numPages!==10)throw new Error('El PDF tiene '+pdf.numPages+' páginas; se esperaban 10');
    await deckPut('pinas2025:pdf',new Blob([buf],{type:'application/pdf'}));
    await deckPut('pinas2025:meta',{pages:10,name:file.name,updatedAt:Date.now(),source:'pdf'});
    exactPdf=pdf;exactPdfLoad=null;
    try{let bc=new BroadcastChannel('promter-risk-deck');bc.postMessage({type:'PR_DECK_UPDATED'});bc.close()}catch(e){}
    if(sc.layout==='presentation')renderPresentation(sc);
  }catch(err){
    $('nativePresentation').innerHTML='<div class="exact-slide-wrap"><div class="deck-missing"><b>No se pudo cargar el PDF</b><span>'+esc(err.message||String(err))+'</span><label class="deck-load-btn" for="programPdfFile">VOLVER A INTENTAR</label></div></div>';
  }
}
async function getExactPdf(){
  if(exactPdf)return exactPdf;
  if(exactPdfLoad)return exactPdfLoad;
  exactPdfLoad=(async()=>{
    const blob=await deckGet('pinas2025:pdf');
    if(!blob)throw new Error('PDF exacto no cargado');
    if(!window.pdfjsLib)throw new Error('PDF.js no está disponible');
    const buf=await blob.arrayBuffer();
    const doc=await pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise;
    if(doc.numPages!==10)throw new Error('El PDF cargado no tiene 10 páginas');
    exactPdf=doc;return doc
  })();
  try{return await exactPdfLoad}finally{exactPdfLoad=null}
}
async function renderExactSlide(sc){
  const box=$('nativePresentation'),n=Number(sc.slideNo||0),token=++exactRenderToken;
  box.innerHTML='<div class="exact-slide-wrap"><div class="deck-missing"><b>Cargando página '+n+'/10…</b><span>'+esc(sc.title||'')+'</span></div></div>';
  try{
    const pdf=await getExactPdf(),page=await pdf.getPage(n);
    if(token!==exactRenderToken)return;
    const base=page.getViewport({scale:1}),targetW=1440,scale=targetW/base.width,viewport=page.getViewport({scale});
    box.innerHTML='<div class="exact-slide-wrap"><canvas id="exactPdfCanvas" class="exact-slide-canvas" aria-label="Página original '+n+' del PDF"></canvas></div>';
    const canvas=$('exactPdfCanvas'),ctx=canvas.getContext('2d',{alpha:false});
    canvas.width=Math.ceil(viewport.width);canvas.height=Math.ceil(viewport.height);
    await page.render({canvasContext:ctx,viewport,background:'#20272d'}).promise;
  }catch(err){
    if(token!==exactRenderToken)return;
    box.innerHTML='<div class="exact-slide-wrap"><div class="deck-missing"><b>PDF exacto no cargado</b><span>Selecciona aquí el PDF original de 10 páginas. Se guardará en este navegador y Promter Risk mostrará sus páginas sin reconstruirlas.</span><label class="deck-load-btn" for="programPdfFile">CARGAR PDF AQUÍ</label></div></div>'
  }
}
function renderPresentation(sc){renderExactSlide(sc)}
function arr(x){return Array.isArray(x)?x:[]}

function renderMulti(sc,st){
  const box=$('multiStage'), participants=sc.participants||[st.speakerId], af=activeFlow(sc,st), q=af.q||{}, target=data.event.speakers[q.to];
  if(sc.layout==='trio'){
    const cards=participants.slice(0,3).map(id=>{let sp=data.event.speakers[id]||{};return '<article class="person-card '+(q.to===id?'active-target':'')+'"><iframe class="person-cam" src="'+esc(viewUrl(sp))+'" allow="autoplay;fullscreen;picture-in-picture"></iframe><div class="person-meta"><div class="person-name">'+esc(sp.name||id)+'</div><div class="person-role">'+esc(sp.role||'')+'</div></div></article>'}).join('');
    box.innerHTML='<div class="multi-top"><div><div class="multi-tag">'+esc(sc.tag||'PANEL')+'</div><div class="multi-title">'+esc(sc.title||'')+'</div></div></div><div class="trio-grid">'+cards+'</div><div class="question-band"><div class="to">PREGUNTA PARA<br>'+esc(target?.name||'panel')+'</div><div class="q">'+esc(q.prompt||sc.question||'')+'</div></div>';
    return;
  }
  if(sc.layout==='moderator'){
    let mid=(sc.participants||['diego'])[0],mod=data.event.speakers[mid]||data.event.speakers[data.event.moderatorId]||{};
    box.innerHTML='<div class="multi-top"><div><div class="multi-tag">'+esc(sc.tag||'MODERACIÓN')+'</div><div class="multi-title">'+esc(sc.title||'')+'</div></div></div><div class="mod-grid"><article class="mod-card"><iframe src="'+esc(viewUrl(mod))+'" allow="autoplay;fullscreen;picture-in-picture"></iframe><div class="person-meta"><div class="person-name">'+esc(mod.name||'Moderador')+'</div><div class="person-role">'+esc(mod.role||'')+'</div></div></article><article class="mod-script"><div class="label">PREGUNTA / ENCUADRE</div><h2>'+esc(q.prompt||sc.lead||'')+'</h2><div class="target">'+(target&&q.to!==mid?'Dirigida a: '+esc(target.name):'Conducción del moderador')+'</div><div class="flow">'+esc(sc.lead||'')+'</div></article></div>';
  }
}
function render(st){
  lastState=st;
  let stage=$('stage');stage.className='';
  if(lastBoardImage)stage.classList.add('has-board-image');
  if(st.black){stage.className='black';return}
  let sc=scenes()[Number(st.sceneIndex)]||scenes()[0]||{},sp=data.event.speakers[st.speakerId]||data.event.speakers.kervin;
  stage.classList.add('layout-'+(sc.layout||'cards'));
  if(sc.layout==='trio'||sc.layout==='moderator'){
    renderMulti(sc,st);
  }else if(sc.layout==='presentation'){
    setCamera(sp);renderPresentation(sc);
  }else{
    setCamera(sp);
    if(lastBoardImage)stage.classList.add('has-board-image');
    $('axis').textContent=sp.axis||'';$('speakerName').textContent=sp.name||'';$('role').textContent=sp.role||'';$('avatar').textContent=initials(sp.name||'PR');
    $('tag').textContent=sc.tag||'CONTENIDO TÉCNICO';$('title').textContent=sc.title||'';$('lead').textContent=sc.lead||'';
    $('cards').innerHTML=(sc.cards||[]).map(c=>'<div class="card"><b>'+c[0]+'</b><span>'+c[1]+'</span></div>').join('');
    $('question').textContent=sc.question||'';$('source').textContent=sc.source||'';
    $('tablebox').innerHTML=sc.table?'<table class="table"><thead><tr>'+sc.table.headers.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+sc.table.rows.map(r=>'<tr>'+r.map((x,i)=>'<td>'+(i===1?'<span class="sf">'+x+'</span>':x)+'</td>').join('')+'</tr>').join('')+'</tbody></table>':'';
    if((sc.layout||'cards')==='board')setTimeout(resizeRemoteBoard,60)
  }
  if(st.alert)stage.classList.add('alert-'+st.alert)
}
